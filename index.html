<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腦筋急轉彎 3D 記憶球批次生成器 | Inside Out Memory Orb Studio v2.0</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f111a;
      --panel-bg: rgba(22, 26, 42, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #f0f4f8;
      --text-sub: #94a3b8;
      --accent-color: #ffd700;
      --font-family: 'Noto Sans TC', 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 215, 0, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 1rem 2rem;
      background: rgba(15, 17, 26, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #ffd700 40%, #ff8c00 70%, #b8860b 100%);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6), inset 0 -2px 6px rgba(0,0,0,0.4);
      animation: orbGlow 3s ease-in-out infinite alternate;
    }

    @keyframes orbGlow {
      0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); transform: scale(1); }
      100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); transform: scale(1.05); }
    }

    .logo-title {
      font-size: 1.35rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #ffab00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .subtitle-tag {
      font-size: 0.8rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      margin-left: 0.5rem;
    }

    /* Top Tabs */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.3rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover {
      color: #f1f5f9;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ffd700 0%, #ff9100 100%);
      color: #000;
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
    }

    /* Main Container Layout */
    .app-container {
      flex: 1;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1700px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Control Panel */
    .control-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.5rem;
    }

    /* Multi Upload Zone */
    .upload-zone {
      border: 2px dashed rgba(255, 215, 0, 0.4);
      background: rgba(255, 215, 0, 0.03);
      border-radius: 16px;
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.08);
      transform: translateY(-2px);
    }

    .upload-icon { font-size: 2rem; margin-bottom: 0.3rem; }
    .upload-text { font-size: 0.88rem; color: #cbd5e1; font-weight: 600; }
    .upload-hint { font-size: 0.72rem; color: #64748b; margin-top: 0.2rem; }
    #fileInput { display: none; }

    /* Photo Carousel / Thumbnail List */
    .photo-list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .photo-list {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 0.4rem 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .photo-thumb-card {
      position: relative;
      flex: 0 0 70px;
      height: 70px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: all 0.2s ease;
      background: #000;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-thumb-card.active {
      border-color: var(--card-theme, #ffd700);
      box-shadow: 0 0 14px var(--card-glow, rgba(255,215,0,0.6));
      transform: scale(1.06);
    }

    .thumb-badge {
      position: absolute;
      top: 3px;
      left: 3px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffd700;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 6px;
    }

    .thumb-delete {
      position: absolute;
      top: 3px;
      right: 3px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      font-size: 0.65rem;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .thumb-delete:hover { background: #ef4444; transform: scale(1.15); }

    /* Batch Actions Toolbar */
    .batch-toolbar {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.25rem;
    }

    .btn-batch {
      flex: 1;
      padding: 0.35rem 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-batch:hover {
      background: rgba(255, 215, 0, 0.15);
      border-color: #ffd700;
      color: #ffd700;
    }

    /* Emotion Grid */
    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .emotion-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.5rem 0.3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .emotion-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .emotion-card.active {
      border-color: var(--theme-color, #ffd700);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px var(--glow-color, rgba(255,215,0,0.4));
    }

    .emotion-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--swatch-bg);
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), 0 0 8px var(--glow-color);
    }

    .emotion-name { font-size: 0.72rem; font-weight: 700; color: #f1f5f9; }
    .emotion-sub { font-size: 0.62rem; color: #94a3b8; }

    /* Controls Group */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .val-badge {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #ffd700;
      background: rgba(255, 215, 0, 0.1);
      padding: 0.1rem 0.5rem;
      border-radius: 8px;
    }

    .preset-buttons {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .btn-preset {
      flex: 1;
      padding: 0.38rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-preset:hover, .btn-preset.active {
      background: rgba(255, 215, 0, 0.15);
      border-color: #ffd700;
      color: #ffd700;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      cursor: pointer;
    }

    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 10px;
      gap: 3px;
    }

    .segmented-btn {
      flex: 1;
      padding: 0.42rem;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented-btn.active {
      background: rgba(255, 215, 0, 0.2);
      color: #ffd700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Main Workspace Views */
    .workspace-stage {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 540px;
      width: 100%;
    }

    /* Single Orb Canvas View */
    .single-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .canvas-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
    }

    #orbCanvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 480px;
      max-height: 480px;
      aspect-ratio: 1 / 1 !important;
      object-fit: contain !important;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-nav:hover { background: rgba(255, 215, 0, 0.15); color: #ffd700; }

    .action-bar {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 550px;
      margin-top: 1.25rem;
    }

    .btn-action {
      flex: 1;
      padding: 0.85rem 1.25rem;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.25s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffd700 0%, #ff9100 100%);
      color: #000;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    /* Print Preview View (A4 Sheets Container) */
    .print-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1.5rem;
    }

    .print-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .a4-sheet-card {
      width: 595px; /* A4 aspect ratio 1 : 1.414 */
      min-height: 842px;
      height: auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      padding: 20px;
      color: #333;
      margin-bottom: 2rem;
    }

    .a4-sheet-header {
      font-size: 13px;
      color: #666;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    .a4-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .a4-orb-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .a4-orb-item canvas {
      border-radius: 50%;
    }

    .a4-orb-label {
      font-size: 11px;
      color: #666;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Print CSS overrides */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      header, .control-panel, .tab-bar, .print-controls, .single-view, .action-bar {
        display: none !important;
      }
      .app-container {
        display: block !important;
        padding: 0 !important;
      }
      .workspace-stage {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
      }
      .print-view {
        display: block !important;
      }
      .a4-sheet-card {
        width: 210mm !important;
        height: 297mm !important;
        box-shadow: none !important;
        page-break-after: always;
        padding: 10mm !important;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <div class="logo-orb"></div>
      <div>
        <span class="logo-title">Inside Out 記憶球批次生成器</span>
        <span class="subtitle-tag">v2.0 多張排版版</span>
      </div>
    </div>

    <!-- Main Navigation Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabSingle" onclick="switchTab('single')">
        🔮 記憶球編輯 preview
      </button>
      <button class="tab-btn" id="tabPrint" onclick="switchTab('print')">
        🖨️ A4 自動排版與列印
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="app-container">

    <!-- Control Panel -->
    <div class="control-panel">

      <!-- 1. Multi Photo Upload -->
      <div class="control-group">
        <div class="section-title">
          <span>📷 1. 上傳相片清單</span>
          <span class="val-badge" id="badgePhotoCount">0 張</span>
        </div>
        
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">🖼️</div>
          <div class="upload-text">點擊或拖曳多張照片至此</div>
          <div class="upload-hint">可一次選擇多張 JPG / PNG</div>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <!-- Thumbnail Carousel -->
        <div class="photo-list-wrapper" id="photoWrapper" style="display: none;">
          <div class="photo-list" id="photoList"></div>

          <div class="batch-toolbar">
            <button class="btn-batch" onclick="batchApplyEmotion()">🎨 當前顏色套用到全部</button>
            <button class="btn-batch" onclick="batchApplySize()">📐 當前尺寸套用到全部</button>
            <button class="btn-batch" onclick="clearAllPhotos()" style="color:#f87171;">🗑️ 清空全部</button>
          </div>
        </div>
      </div>

      <!-- 2. Emotion Color Palette -->
      <div class="control-group">
        <div class="section-title">🎨 2. 選擇腦筋急轉彎情緒</div>
        <div class="emotion-grid" id="emotionGrid"></div>
      </div>

      <!-- 3. Orb Specifications -->
      <div class="control-group">
        <div class="section-title">📐 3. 記憶球與相片尺寸</div>
        
        <div class="label-row">
          <span>記憶球直徑 (外框)</span>
          <span class="val-badge" id="valOrbSize">13.0 cm</span>
        </div>
        <div class="preset-buttons">
          <button class="btn-preset" onclick="setOrbPreset(7)">7 cm (個人)</button>
          <button class="btn-preset active" onclick="setOrbPreset(13)">13 cm (合照)</button>
          <button class="btn-preset" onclick="setOrbPreset(14)">14 cm (特大)</button>
        </div>
        <input type="range" id="inputOrbSize" min="3" max="20" step="0.5" value="13" oninput="updateOrbSize(this.value)">

        <div class="label-row" style="margin-top: 0.4rem;">
          <span>內層相片開口比例</span>
          <span class="val-badge" id="valPhotoRatio">92.3% (12 cm)</span>
        </div>
        <div class="preset-buttons">
          <button class="btn-preset" onclick="setPhotoRatioPreset(0.75)">75.0% (5.25cm)</button>
          <button class="btn-preset active" onclick="setPhotoRatioPreset(0.923)">92.3% (12.0cm)</button>
        </div>
        <input type="range" id="inputPhotoRatio" min="0.50" max="0.95" step="0.01" value="0.923" oninput="updatePhotoRatio(this.value)">
      </div>

      <!-- 4. Layout Mode & Adjustments -->
      <div class="control-group">
        <div class="section-title">🖼️ 4. 相片模式與微調</div>

        <div class="segmented-control">
          <div class="segmented-btn active" id="btnModeFull" onclick="setFitMode('full')">🌟 100%全景無裁切</div>
          <div class="segmented-btn" id="btnModeCrop" onclick="setFitMode('crop')">👤 圓形特寫裁切</div>
        </div>

        <div class="label-row" style="margin-top: 0.4rem;">
          <span>照片縮放 (Zoom)</span>
          <span class="val-badge" id="valZoom">100%</span>
        </div>
        <input type="range" id="inputZoom" min="0.5" max="2.5" step="0.05" value="1.0" oninput="updateActivePhotoControls()">

        <div class="label-row">
          <span>水平位置 (Pan X)</span>
          <span class="val-badge" id="valPanX">0 px</span>
        </div>
        <input type="range" id="inputPanX" min="-200" max="200" step="2" value="0" oninput="updateActivePhotoControls()">

        <div class="label-row">
          <span>垂直位置 (Pan Y)</span>
          <span class="val-badge" id="valPanY">0 px</span>
        </div>
        <input type="range" id="inputPanY" min="-200" max="200" step="2" value="0" oninput="updateActivePhotoControls()">

        <div class="label-row" id="rowBlur">
          <span>背景柔焦程度 (Blur)</span>
          <span class="val-badge" id="valBlur">25 px</span>
        </div>
        <input type="range" id="inputBlur" min="0" max="60" step="2" value="25" oninput="updateActivePhotoControls()">
      </div>

    </div>

    <!-- Main Workspace Stage -->
    <div class="workspace-stage">

      <!-- View Tab 1: Single Orb Canvas Preview -->
      <div class="single-view" id="singleView">
        <div class="canvas-wrapper">
          <canvas id="orbCanvas" width="1535" height="1535"></canvas>
        </div>

        <!-- Navigation for photo list -->
        <div class="nav-buttons">
          <button class="btn-nav" onclick="navigatePhoto(-1)">◄ 上一張</button>
          <span id="navPhotoLabel" style="font-size:0.85rem; font-weight:700; color:#ffd700;">第 1 / 1 張</span>
          <button class="btn-nav" onclick="navigatePhoto(1)">下一張 ►</button>
        </div>

        <div class="action-bar">
          <button class="btn-action btn-primary" onclick="downloadCurrentOrb('png')">
            📥 下載目前這張記憶球 (PNG)
          </button>
          <button class="btn-action btn-secondary" onclick="switchTab('print')">
            🖨️ 前往 A4 排版並列印/存為PDF
          </button>
        </div>
      </div>

      <!-- View Tab 2: A4 Automatic Print Layout Preview -->
      <div class="print-view" id="printView">
        <div class="print-controls">
          <button class="btn-action btn-primary" onclick="window.print()">
            🖨️ 一鍵列印 / 存為 A4 PDF 檔
          </button>
          <button class="btn-action btn-secondary" onclick="downloadAllOrbsPng()">
            📦 打包下載全部記憶球 (PNG)
          </button>
        </div>

        <div id="a4SheetsContainer">
          <!-- Dynamically generated A4 Sheet Cards -->
        </div>
      </div>

    </div>

  </div>

  <script>
    // Emotion Palettes Definition
    const EMOTION_PALETTES = {
      joy: {
        name: "樂樂 (Joy)", sub: "金黃熱情",
        swatch: "radial-gradient(circle, #fff 0%, #ffd700 50%, #ff8c00 100%)",
        theme: "#ffd700", glow: "rgba(255, 215, 0, 0.6)",
        colors: {
          aura: ["#ffffff", "#ffe066", "#ffd700", "#ff8c00", "#b8860b"],
          shell: ["#ffffff", "#fff3a0", "#ffd700", "#d4af37"], glass: "rgba(255, 235, 120, 0.45)"
        }
      },
      sadness: {
        name: "憂憂 (Sadness)", sub: "靜謐湛藍",
        swatch: "radial-gradient(circle, #e0f2fe 0%, #0284c7 50%, #0369a1 100%)",
        theme: "#38bdf8", glow: "rgba(56, 189, 248, 0.6)",
        colors: {
          aura: ["#ffffff", "#bae6fd", "#38bdf8", "#0284c7", "#075985"],
          shell: ["#ffffff", "#7dd3fc", "#0284c7", "#0369a1"], glass: "rgba(186, 230, 253, 0.45)"
        }
      },
      disgust: {
        name: "厭厭 (Disgust)", sub: "翡翠翡綠",
        swatch: "radial-gradient(circle, #dcfce7 0%, #22c55e 50%, #15803d 100%)",
        theme: "#4ade80", glow: "rgba(74, 222, 128, 0.6)",
        colors: {
          aura: ["#ffffff", "#86efac", "#22c55e", "#15803d", "#14532d"],
          shell: ["#ffffff", "#4ade80", "#16a34a", "#15803d"], glass: "rgba(187, 247, 208, 0.45)"
        }
      },
      anger: {
        name: "怒怒 (Anger)", sub: "烈火熾紅",
        swatch: "radial-gradient(circle, #fee2e2 0%, #ef4444 50%, #b91c1c 100%)",

        colors: {
          aura: ["#ffffff", "#fca5a5", "#ef4444", "#dc2626", "#7f1d1d"],
          shell: ["#ffffff", "#f87171", "#dc2626", "#991b1b"], glass: "rgba(254, 202, 202, 0.45)"
        }
      },
      anxiety: {
        name: "焦焦 (Anxiety)", sub: "活力鮮橘",
        swatch: "radial-gradient(circle, #ffedd5 0%, #f97316 50%, #c2410c 100%)",
        theme: "#fb923c", glow: "rgba(251, 146, 60, 0.6)",
        colors: {
          aura: ["#ffffff", "#fed7aa", "#f97316", "#ea580c", "#9a3412"],
          shell: ["#ffffff", "#fb923c", "#ea580c", "#c2410c"], glass: "rgba(254, 215, 170, 0.45)"
        }
      },
      fear: {
        name: "阿驚 (Fear)", sub: "神秘夢幻紫",
        swatch: "radial-gradient(circle, #f3e8ff 0%, #a855f7 50%, #6b21a8 100%)",
        theme: "#c084fc", glow: "rgba(192, 132, 252, 0.6)",
        colors: {
          aura: ["#ffffff", "#e9d5ff", "#a855f7", "#7e22ce", "#581c87"],
          shell: ["#ffffff", "#c084fc", "#9333ea", "#6b21a8"], glass: "rgba(233, 213, 255, 0.45)"
        }

      embarrassment: {

        swatch: "radial-gradient(circle, #fce7f3 0%, #ec4899 50%, #9d174d 100%)",
        theme: "#f472b6", glow: "rgba(244, 114, 182, 0.6)",
        colors: {
          aura: ["#ffffff", "#fbcfe8", "#ec4899", "#be185d", "#831843"],
          shell: ["#ffffff", "#f472b6", "#db2777", "#9d174d"], glass: "rgba(251, 207, 232, 0.45)"
        }
      },
      envy: {
        name: "慕慕 (Envy)", sub: "晶瑩藍綠",
        swatch: "radial-gradient(circle, #ccfbf1 0%, #14b8a6 50%, #0f766e 100%)",
        theme: "#2dd4bf", glow: "rgba(45, 212, 191, 0.6)",
        colors: {
          aura: ["#ffffff", "#99f6e4", "#14b8a6", "#0d9488", "#115e59"],
          shell: ["#ffffff", "#2dd4bf", "#0d9488", "#0f766e"], glass: "rgba(153, 246, 228, 0.45)"
        }
      },
      rainbow: {
        name: "核心彩虹 (Core)", sub: "七彩記憶",
        swatch: "conic-gradient(#ffd700, #ff8c00, #ef4444, #ec4899, #a855f7, #38bdf8, #22c55e, #ffd700)",
        theme: "#ffd700", glow: "rgba(255, 215, 0, 0.6)",
        colors: {
          aura: ["#ffffff", "#ffd700", "#ff7b00", "#a855f7", "#0284c7"],
          shell: ["#ffffff", "#ffd700", "#a855f7", "#0284c7"], glass: "rgba(255, 255, 255, 0.5)"
        }
      }
    };

    // State
    let photoList = []; // Array of photo objects
    let activeIndex = 0;
    let currentTab = "single"; // 'single' or 'print'

    const canvas = document.getElementById("orbCanvas");
    const ctx = canvas.getContext("2d");

    // Init UI
    function initUI() {
      // Build Emotion Cards Grid
      const grid = document.getElementById("emotionGrid");
      grid.innerHTML = "";
      Object.keys(EMOTION_PALETTES).forEach(key => {
        const pal = EMOTION_PALETTES[key];
        const card = document.createElement("div");
        card.className = "emotion-card";
        card.id = `emotion_${key}`;
        card.style.setProperty('--swatch-bg', pal.swatch);
        card.style.setProperty('--theme-color', pal.theme);
        card.style.setProperty('--glow-color', pal.glow);
        card.onclick = () => setPhotoEmotion(key);

        card.innerHTML = `
          <div class="emotion-swatch"></div>
          <div class="emotion-name">${pal.name.split(' ')[0]}</div>
          <div class="emotion-sub">${pal.sub}</div>
        `;
        grid.appendChild(card);
      });

      // Drag & Drop
      const dropZone = document.getElementById("uploadZone");
      dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("dragover"); };
      dropZone.ondragleave = () => dropZone.classList.remove("dragover");
      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          handleFilesSelect(e.dataTransfer.files);
        }
      };

      document.getElementById("fileInput").onchange = (e) => {
        if (e.target.files.length) {
          handleFilesSelect(e.target.files);
        }
      };

      // Create default sample demo photo
      createDefaultSampleImages();
    }

    function createDefaultSampleImages() {
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = 1200;
      tempCanvas.height = 800;
      const tCtx = tempCanvas.getContext("2d");

      const grad = tCtx.createLinearGradient(0, 0, 1200, 800);
      grad.addColorStop(0, "#1e293b");
      grad.addColorStop(0.5, "#334155");
      grad.addColorStop(1, "#0f172a");
      tCtx.fillStyle = grad;
      tCtx.fillRect(0, 0, 1200, 800);

      tCtx.fillStyle = "#ffd700";
      tCtx.font = "bold 55px 'Noto Sans TC', sans-serif";
      tCtx.textAlign = "center";
      tCtx.fillText("103班 聰勤門 Inside Out 記憶球", 600, 360);

      tCtx.fillStyle = "#94a3b8";
      tCtx.font = "32px 'Noto Sans TC', sans-serif";
      tCtx.fillText("請點擊左側「上傳相片清單」上傳多張個人照或合照", 600, 440);

      const img = new Image();
      img.onload = () => {
        photoList.push(createNewPhotoObj("103班範例合照", img));
        activeIndex = 0;
        updatePhotoListUI();
        syncControlsFromActivePhoto();
        renderActiveOrb();
      };
      img.src = tempCanvas.toDataURL();
    }

    function createNewPhotoObj(name, imgObj) {
      return {
        id: "p_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
        name: name,
        img: imgObj,
        emotion: "joy",
        orbSizeCm: 13.0,
        photoRatio: 0.923,
        fitMode: "full",
        zoom: 1.0,
        panX: 0,
        panY: 0,
        blur: 25
      };
    }

    // Handle File Selection (Batch Support)
    function handleFilesSelect(files) {
      let loadedCount = 0;
      const total = files.length;

      Array.from(files).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            photoList.push(createNewPhotoObj(file.name, img));
            loadedCount++;
            if (loadedCount === total) {
              activeIndex = photoList.length - total; // Focus on first newly added photo
              updatePhotoListUI();
              syncControlsFromActivePhoto();
              renderActiveOrb();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Update Photo List UI (Thumbnails Bar)
    function updatePhotoListUI() {
      const wrapper = document.getElementById("photoWrapper");
      const listEl = document.getElementById("photoList");
      document.getElementById("badgePhotoCount").innerText = `${photoList.length} 張`;

      if (photoList.length === 0) {
        wrapper.style.display = "none";
        return;
      }

      wrapper.style.display = "flex";
      listEl.innerHTML = "";

      photoList.forEach((item, idx) => {
        const pal = EMOTION_PALETTES[item.emotion];
        const card = document.createElement("div");
        card.className = `photo-thumb-card ${idx === activeIndex ? 'active' : ''}`;
        card.style.setProperty('--card-theme', pal.theme);
        card.style.setProperty('--card-glow', pal.glow);
        card.onclick = () => selectPhotoIndex(idx);

        card.innerHTML = `
          <img src="${item.img.src}">
          <div class="thumb-badge">#${idx + 1}</div>
          <div class="thumb-delete" onclick="event.stopPropagation(); deletePhotoIndex(${idx})">✕</div>
        `;
        listEl.appendChild(card);
      });

      document.getElementById("navPhotoLabel").innerText = `第 ${activeIndex + 1} / ${photoList.length} 張`;
    }

    function selectPhotoIndex(idx) {
      if (idx < 0 || idx >= photoList.length) return;
      activeIndex = idx;
      updatePhotoListUI();
      syncControlsFromActivePhoto();
      renderActiveOrb();
    }

    function deletePhotoIndex(idx) {
      photoList.splice(idx, 1);
      if (activeIndex >= photoList.length) {
        activeIndex = Math.max(0, photoList.length - 1);
      }
      updatePhotoListUI();
      if (photoList.length > 0) {
        syncControlsFromActivePhoto();
        renderActiveOrb();
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function clearAllPhotos() {
      if (confirm("確定要清空全部上傳的照片嗎？")) {
        photoList = [];
        activeIndex = 0;
        updatePhotoListUI();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function navigatePhoto(dir) {
      if (photoList.length === 0) return;
      let newIdx = activeIndex + dir;
      if (newIdx < 0) newIdx = photoList.length - 1;
      if (newIdx >= photoList.length) newIdx = 0;
      selectPhotoIndex(newIdx);
    }

    // Sync UI Sliders/Buttons with active photo settings
    function syncControlsFromActivePhoto() {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];

      // Emotion cards active state
      document.querySelectorAll(".emotion-card").forEach(el => el.classList.remove("active"));
      const activeEmotionCard = document.getElementById(`emotion_${p.emotion}`);
      if (activeEmotionCard) activeEmotionCard.classList.add("active");

      // Orb Size
      document.getElementById("inputOrbSize").value = p.orbSizeCm;
      document.getElementById("valOrbSize").innerText = p.orbSizeCm.toFixed(1) + " cm";
      document.querySelectorAll("#inputOrbSize ~ .preset-buttons .btn-preset").forEach(btn => btn.classList.remove("active"));

      // Ratio
      document.getElementById("inputPhotoRatio").value = p.photoRatio;
      const photoCm = (p.orbSizeCm * p.photoRatio).toFixed(1);
      document.getElementById("valPhotoRatio").innerText = (p.photoRatio * 100).toFixed(1) + `% (${photoCm} cm)`;

      // Fit mode
      document.getElementById("btnModeFull").classList.toggle("active", p.fitMode === 'full');
      document.getElementById("btnModeCrop").classList.toggle("active", p.fitMode === 'crop');
      document.getElementById("rowBlur").style.display = p.fitMode === 'full' ? 'flex' : 'none';
      document.getElementById("inputBlur").style.display = p.fitMode === 'full' ? 'block' : 'none';

      // Sliders
      document.getElementById("inputZoom").value = p.zoom;
      document.getElementById("valZoom").innerText = Math.round(p.zoom * 100) + "%";

      document.getElementById("inputPanX").value = p.panX;
      document.getElementById("valPanX").innerText = p.panX + " px";

      document.getElementById("inputPanY").value = p.panY;
      document.getElementById("valPanY").innerText = p.panY + " px";

      document.getElementById("inputBlur").value = p.blur;
      document.getElementById("valBlur").innerText = p.blur + " px";
    }

    // Update active photo controls when user moves sliders
    function updateActivePhotoControls() {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];

      p.zoom = parseFloat(document.getElementById("inputZoom").value);
      p.panX = parseInt(document.getElementById("inputPanX").value);
      p.panY = parseInt(document.getElementById("inputPanY").value);
      p.blur = parseInt(document.getElementById("inputBlur").value);

      document.getElementById("valZoom").innerText = Math.round(p.zoom * 100) + "%";
      document.getElementById("valPanX").innerText = p.panX + " px";
      document.getElementById("valPanY").innerText = p.panY + " px";
      document.getElementById("valBlur").innerText = p.blur + " px";

      renderActiveOrb();
    }

    function setPhotoEmotion(key) {
      if (photoList.length === 0) return;
      photoList[activeIndex].emotion = key;
      syncControlsFromActivePhoto();
      updatePhotoListUI();
      renderActiveOrb();
    }

    function setOrbPreset(cm) {
      updateOrbSize(cm);
      document.getElementById("inputOrbSize").value = cm;
    }

    function updateOrbSize(val) {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];
      p.orbSizeCm = parseFloat(val);
      syncControlsFromActivePhoto();
      renderActiveOrb();
    }

    function setPhotoRatioPreset(ratio) {
      updatePhotoRatio(ratio);
      document.getElementById("inputPhotoRatio").value = ratio;
    }

    function updatePhotoRatio(val) {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];
      p.photoRatio = parseFloat(val);
      syncControlsFromActivePhoto();
      renderActiveOrb();
    }

    function setFitMode(mode) {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];
      p.fitMode = mode;
      syncControlsFromActivePhoto();
      renderActiveOrb();
    }

    // Batch Apply Actions
    function batchApplyEmotion() {
      if (photoList.length === 0) return;
      const emo = photoList[activeIndex].emotion;
      photoList.forEach(p => p.emotion = emo);
      updatePhotoListUI();
      alert(`已成功將「${EMOTION_PALETTES[emo].name}」色彩套用到全套 ${photoList.length} 張照片！`);
    }

    function batchApplySize() {
      if (photoList.length === 0) return;
      const pActive = photoList[activeIndex];
      photoList.forEach(p => {
        p.orbSizeCm = pActive.orbSizeCm;
        p.photoRatio = pActive.photoRatio;
        p.fitMode = pActive.fitMode;
      });
      alert(`已成功將「${pActive.orbSizeCm}cm」規格套用到全套 ${photoList.length} 張照片！`);
    }

    // Render single Memory Orb onto a given target canvas
    function drawMemoryOrbToCanvas(targetCanvas, photoObj) {
      if (!photoObj) return;

      try {
        const tCtx = targetCanvas.getContext("2d");
        const canvasDim = Math.round((photoObj.orbSizeCm || 13) * 118.11); // 300 DPI
        targetCanvas.width = canvasDim;
        targetCanvas.height = canvasDim;

        tCtx.clearRect(0, 0, canvasDim, canvasDim);

        const center = canvasDim / 2;
        const outerR = canvasDim / 2 - 10;
        const innerR = outerR * (photoObj.photoRatio || 0.923);
        const pal = EMOTION_PALETTES[photoObj.emotion || "joy"] || EMOTION_PALETTES["joy"];

        // 1. Render Outer Glowing Emotion Aura
        const auraGrad = tCtx.createRadialGradient(center, center, innerR * 0.8, center, center, outerR * 1.05);
        auraGrad.addColorStop(0, pal.colors.aura[0]);
        auraGrad.addColorStop(0.3, pal.colors.aura[1]);
        auraGrad.addColorStop(0.6, pal.colors.aura[2]);
        auraGrad.addColorStop(0.85, pal.colors.aura[3]);
        auraGrad.addColorStop(1.0, "rgba(0,0,0,0)");

        tCtx.fillStyle = auraGrad;
        tCtx.beginPath();
        tCtx.arc(center, center, outerR * 1.05, 0, Math.PI * 2);
        tCtx.fill();

        // 2. Render Inner Photo Aperture
        tCtx.save();
        tCtx.beginPath();
        tCtx.arc(center, center, innerR, 0, Math.PI * 2);
        tCtx.clip();

        const innerDim = innerR * 2;
        const hasImg = photoObj.img && (photoObj.img.naturalWidth || photoObj.img.width);
        const imgW = hasImg ? (photoObj.img.naturalWidth || photoObj.img.width) : 1200;
        const imgH = hasImg ? (photoObj.img.naturalHeight || photoObj.img.height) : 800;

        if (hasImg) {
          if (photoObj.fitMode === 'full') {
            // Full Width Mode with Blurred Background
            const bgCanvas = document.createElement("canvas");
            bgCanvas.width = innerDim;
            bgCanvas.height = innerDim;
            const bgCtx = bgCanvas.getContext("2d");

            const bgScale = Math.max(innerDim / imgW, innerDim / imgH);
            const bgW = imgW * bgScale;
            const bgH = imgH * bgScale;

            try {
              bgCtx.filter = `blur(${photoObj.blur || 25}px)`;
            } catch(e) {}

            bgCtx.drawImage(photoObj.img, (innerDim - bgW)/2 + (photoObj.panX || 0), (innerDim - bgH)/2 + (photoObj.panY || 0), bgW, bgH);

            tCtx.drawImage(bgCanvas, center - innerR, center - innerR);

            // Foreground Photo
            const diag = Math.sqrt(imgW * imgW + imgH * imgH);
            const fitScale = (innerDim * 0.95 * (photoObj.zoom || 1.0)) / diag;
            const fw = imgW * fitScale;
            const fh = imgH * fitScale;

            const fx = center - fw / 2 + (photoObj.panX || 0);
            const fy = center - fh / 2 + (photoObj.panY || 0);

            tCtx.save();
            tCtx.shadowColor = "rgba(0,0,0,0.5)";
            tCtx.shadowBlur = 20;
            tCtx.drawImage(photoObj.img, fx, fy, fw, fh);
            tCtx.restore();

          } else {
            // Direct Crop Mode
            const scale = Math.max(innerDim / imgW, innerDim / imgH) * (photoObj.zoom || 1.0);
            const sw = imgW * scale;
            const sh = imgH * scale;

            const sx = center - sw / 2 + (photoObj.panX || 0);
            const sy = center - sh / 2 + (photoObj.panY || 0);

            tCtx.drawImage(photoObj.img, sx, sy, sw, sh);
          }
        } else {
          // Fallback aura gradient placeholder
          const pGrad = tCtx.createRadialGradient(center, center, 0, center, center, innerR);
          pGrad.addColorStop(0, pal.colors.aura[1]);
          pGrad.addColorStop(1, pal.colors.aura[3]);
          tCtx.fillStyle = pGrad;
          tCtx.fillRect(center - innerR, center - innerR, innerDim, innerDim);
        }

        tCtx.restore();

        // 3. Render 3D Glass Shell & Specular Reflection
        const ringGrad = tCtx.createRadialGradient(center, center, innerR * 0.95, center, center, outerR);
        ringGrad.addColorStop(0, "rgba(255,255,255,0)");
        ringGrad.addColorStop(0.5, pal.colors.glass);
        ringGrad.addColorStop(0.85, pal.colors.shell[1]);
        ringGrad.addColorStop(1.0, pal.colors.shell[3]);

        tCtx.lineWidth = outerR - innerR;
        tCtx.strokeStyle = ringGrad;
        tCtx.beginPath();
        tCtx.arc(center, center, (innerR + outerR)/2, 0, Math.PI * 2);
        tCtx.stroke();

        // Top Crescent Highlight
        const highlightGrad = tCtx.createRadialGradient(
          center, center - outerR * 0.7, 2,
          center, center - outerR * 0.7, outerR * 0.5
        );
        highlightGrad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
        highlightGrad.addColorStop(0.4, "rgba(255, 255, 255, 0.15)");
        highlightGrad.addColorStop(1, "rgba(255, 255, 255, 0)");

        tCtx.fillStyle = highlightGrad;
        tCtx.beginPath();
        tCtx.ellipse(center, center - outerR * 0.65, outerR * 0.45, outerR * 0.18, 0, 0, Math.PI * 2);
        tCtx.fill();

        // Bottom Glass Reflection
        const bottomGrad = tCtx.createRadialGradient(
          center, center + outerR * 0.75, 2,
          center, center + outerR * 0.75, outerR * 0.4
        );
        bottomGrad.addColorStop(0, pal.colors.glass);
        bottomGrad.addColorStop(1, "rgba(255, 255, 255, 0)");

        tCtx.fillStyle = bottomGrad;
        tCtx.beginPath();
        tCtx.ellipse(center, center + outerR * 0.7, outerR * 0.4, outerR * 0.15, 0, 0, Math.PI * 2);
        tCtx.fill();

        // Outer Fine Rim
        tCtx.lineWidth = 3;
        tCtx.strokeStyle = "rgba(255, 255, 255, 0.85)";
        tCtx.beginPath();
        tCtx.arc(center, center, outerR, 0, Math.PI * 2);
        tCtx.stroke();
      } catch (err) {
        console.error("Error drawing memory orb:", err);
      }
    }

    function renderActiveOrb() {
      if (photoList.length === 0) return;
      drawMemoryOrbToCanvas(canvas, photoList[activeIndex]);
    }

    // Switch Tabs
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabSingle").classList.toggle("active", tab === 'single');
      document.getElementById("tabPrint").classList.toggle("active", tab === 'print');

      document.getElementById("singleView").style.display = tab === 'single' ? 'flex' : 'none';
      document.getElementById("printView").style.display = tab === 'print' ? 'flex' : 'none';

      if (tab === 'print') {
        renderA4PrintPack();
      }
    }

    // Render A4 Automatic Print Pack Sheets
    function renderA4PrintPack() {
      const container = document.getElementById("a4SheetsContainer");
      container.innerHTML = "";

      if (photoList.length === 0) {
        container.innerHTML = `<div style="color:#94a3b8; font-size:1.1rem; padding:3rem;">目前沒有任何照片，請先於左側上傳照片！</div>`;
        return;
      }

      // Group photos into A4 pages
      // Standard A4 packing: 7cm = 6 per page (2x3), 13cm = 2 per page (1x2)
      let pages = [];
      let currentPage = [];
      let currentLimit = 6;

      photoList.forEach((p, idx) => {
        let limit = p.orbSizeCm >= 10 ? 2 : 6;
        if (currentPage.length >= limit || (currentPage.length > 0 && currentLimit !== limit)) {
          pages.push(currentPage);
          currentPage = [];
        }
        currentLimit = limit;
        currentPage.push({ photo: p, globalIdx: idx + 1 });
      });

      if (currentPage.length > 0) pages.push(currentPage);

      pages.forEach((pageItems, pageIdx) => {
        const card = document.createElement("div");
        card.className = "a4-sheet-card";

        const isGroupPage = pageItems[0].photo.orbSizeCm >= 10;
        const pageTitle = isGroupPage ? `13cm 全班大合照記憶球` : `7cm 個人與親子記憶球`;

        card.innerHTML = `
          <div class="a4-sheet-header">
            103班 Inside Out 記憶球教室佈置 A4 列印頁 - 第 ${pageIdx + 1} 頁 (共 ${pages.length} 頁) - ${pageTitle}
          </div>
          <div class="a4-grid" id="grid_page_${pageIdx}"></div>
        `;
        container.appendChild(card);

        const gridEl = card.querySelector(`#grid_page_${pageIdx}`);

        pageItems.forEach(item => {
          const p = item.photo;
          const orbDiv = document.createElement("div");
          orbDiv.className = "a4-orb-item";

          const itemCanvas = document.createElement("canvas");
          const displayPx = p.orbSizeCm >= 10 ? 320 : 230; // Scale canvas for screen preview
          itemCanvas.style.width = displayPx + "px";
          itemCanvas.style.height = displayPx + "px";

          drawMemoryOrbToCanvas(itemCanvas, p);

          orbDiv.appendChild(itemCanvas);

          const labelDiv = document.createElement("div");
          labelDiv.className = "a4-orb-label";
          labelDiv.innerText = `#${item.globalIdx} (${emoName}) - ${p.orbSizeCm}cm`;
          orbDiv.appendChild(labelDiv);

          gridEl.appendChild(orbDiv);
        });
      });
    }

    // Download Handler
    function downloadCurrentOrb(format) {
      if (photoList.length === 0) return;
      const p = photoList[activeIndex];
      const link = document.createElement("a");
      link.download = `InsideOut_MemoryOrb_${p.name}_${p.emotion}_${p.orbSizeCm}cm.${format}`;

      if (format === 'png') {
        link.href = canvas.toDataURL("image/png");
      } else {
        const jpgCanvas = document.createElement("canvas");
        jpgCanvas.width = canvas.width;
        jpgCanvas.height = canvas.height;
        const jCtx = jpgCanvas.getContext("2d");
        jCtx.fillStyle = "#ffffff";
        jCtx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
        jCtx.drawImage(canvas, 0, 0);
        link.href = jpgCanvas.toDataURL("image/jpeg", 0.95);
      }
      link.click();
    }

    function downloadAllOrbsPng() {
      if (photoList.length === 0) return;
      alert(`正在下載全部 ${photoList.length} 張記憶球高解析 PNG 圖檔...`);
      photoList.forEach((p, idx) => {
        setTimeout(() => {
          const tempC = document.createElement("canvas");
          drawMemoryOrbToCanvas(tempC, p);
          const link = document.createElement("a");
          link.download = `MemoryOrb_${idx+1}_${p.emotion}_${p.orbSizeCm}cm.png`;
          link.href = tempC.toDataURL("image/png");
          link.click();
        }, idx * 300);
      });
    }

    // Init Page
    window.onload = initUI;
  </script>
</body>
</html>
